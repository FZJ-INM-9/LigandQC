[project]
name = "ligandqc"
version = "1.0.0"
description = "A python tool to check the quality of ligand structures from the Protein Data Bank."
authors = [
    {name = "c.bergeest",email = "112690532+brgstfzj@users.noreply.github.com"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "click (>=8.1.8,<9.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "rich (>=14.0.0,<15.0.0)",
    "aiohttp (>=3.11.16,<4.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scipy (>=1.15.2,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "rcsb-api (>=1.1.2,<2.0.0)",
    "matplotlib-venn (>=1.1.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
ligandqc = "ligandqc.cli:main"

[dependency-groups]
docs = [
    "sphinx (>=9.1.0,<10.0.0)",
    "myst-parser (>=5.1.0,<6.0.0)",
    "sphinxcontrib-mermaid (>=2.1.1,<3.0.0)",
    "sphinx-click (>=6.2.0,<7.0.0)",
    "sphinxemoji (>=0.3.2,<0.4.0)",
    "sphinxcontrib-bibtex (>=2.7.0,<3.0.0)",
    "sphinx-copybutton (>=0.5.2,<0.6.0)",
    "furo (>=2025.12.19,<2026.0.0)",
    "sphinx-autobuild (>=2025.8.25,<2026.0.0)",
    "sphinx-togglebutton (>=0.4.5,<0.5.0)",
    "sphinx-design (>=0.7.0,<0.8.0)"
]
dev = [
    "jupyterlab (>=4.4.0,<5.0.0)",
    "pytest (>=8.3.5,<9.0.0)",
]

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.dev]
optional = true