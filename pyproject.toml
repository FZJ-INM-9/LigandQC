[project]
name = "ligand_inspector"
version = "0.1.0"
description = "A webscraper for ligands from the Protein Data Bank."
authors = [
    {name = "c.bergeest",email = "c.bergeest@fz-juelich.de"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click (>=8.1.8,<9.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "pytest (>=8.3.5,<9.0.0)",
    "rich (>=14.0.0,<15.0.0)",
    "aiohttp (>=3.11.16,<4.0.0)",
    "bs4 (>=0.0.2,<0.0.3)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
ligand_inspector = "ligand_inspector.__main__:main"